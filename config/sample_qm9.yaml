data:
  data: QM9
  dir: './data'
  batch_size: 1024
  max_node_num: 9
  max_feat_num: 4
  init: atom

ckpt: gdss_qm9

sampler:
  predictor: Reverse
  corrector: Langevin
  snr: 0.2
  scale_eps: 0.7
  n_steps: 1

sample:
  use_ema: False
  noise_removal: True
  probability_flow: False
  eps: 1.0e-4
  seed: 42
